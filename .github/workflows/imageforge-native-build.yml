name: imageforge-native-win64-build

on:
  pull_request:
    branches: [ main ]
    paths:
      - "imageforge-native-build/**"
      - ".github/workflows/imageforge-native-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile native Win64 app
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++20 /O2 /MT /EHsc /DUNICODE /D_UNICODE /DNOMINMAX imageforge-native-build\main.cpp /Fe:dist\ImageForgeAI.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64 windowscodecs.lib ole32.lib shell32.lib dwmapi.lib comdlg32.lib user32.lib gdi32.lib

      - name: Verify x64 PE
        shell: cmd
        run: |
          dumpbin /headers dist\ImageForgeAI.exe | findstr /C:"machine (x64)"

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          & $iscc "imageforge-native-build\installer-ci.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: ImageForgeAI-Win64-v1.1.2
          path: dist/ImageForgeAI.exe
          if-no-files-found: error

      - name: Upload native installer
        uses: actions/upload-artifact@v4
        with:
          name: ImageForgeAI-Setup-x64-v1.1.2
          path: dist-installer/ImageForgeAI-Setup-x64-v1.1.2.exe
          if-no-files-found: error
