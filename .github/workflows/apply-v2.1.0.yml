name: Apply Manga HQ Reader v2.1.0

on:
  push:
    paths:
      - 'release-v2.1.0-ready.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply release archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="release-v2.1.0-ready.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Release archive already consumed."
            exit 0
          fi
          TMP="$RUNNER_TEMP/mhqr-v2.1.0"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$ARCHIVE" -d "$TMP"
          SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -name 'Manga-HQ-Reader*' | head -n 1)"
          test -n "$SRC"
          rsync -a --delete "$SRC"/ ./ --exclude '.git/' --exclude '.github/' --exclude 'release-v2.1.0.zip' --exclude 'release-v2.1.0-ready.zip'
          rm -f release-v2.1.0.zip release-v2.1.0-ready.zip

      - name: Validate release
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f js/app.js
          test -f css/app.css
          test -f data/catalog.json
          node --check js/app.js
          python -m json.tool data/catalog.json >/dev/null
          grep -q "2.1.0" index.html
          grep -q "1xVUuHmicfUlKj30fZ7h0vMf9ipdzvFjy" config.js

      - name: Commit published site
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish Manga HQ Reader v2.1.0"
          git push
