name: imageforge-native-x64-final

on:
  pull_request:
    branches: [ main ]
    paths:
      - "imageforge-native-build/**"
      - ".github/workflows/imageforge-native-x64-setup.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile ImageForgeAI.exe x64
        shell: cmd
        run: |
          if not exist dist mkdir dist
          if not exist dist-installer mkdir dist-installer
          cl /nologo /std:c++20 /O2 /MT /EHsc /DUNICODE /D_UNICODE /DNOMINMAX imageforge-native-build\main.cpp /Fe:dist\ImageForgeAI.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64 windowscodecs.lib ole32.lib shell32.lib dwmapi.lib comdlg32.lib user32.lib gdi32.lib

      - name: Embed app payload into native x64 installer
        shell: cmd
        run: |
          echo 101 RCDATA "dist\\ImageForgeAI.exe" > imageforge-native-build\installer_payload.rc
          rc /nologo /fo dist\installer_payload.res imageforge-native-build\installer_payload.rc
          cl /nologo /std:c++20 /O2 /MT /EHsc /DUNICODE /D_UNICODE /DNOMINMAX imageforge-native-build\setup.cpp dist\installer_payload.res /Fe:dist-installer\ImageForgeAI-Setup-x64-v1.1.2.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64 shell32.lib ole32.lib advapi32.lib user32.lib

      - name: Verify both binaries are x64
        shell: cmd
        run: |
          dumpbin /headers dist\ImageForgeAI.exe | findstr /C:"machine (x64)"
          dumpbin /headers dist-installer\ImageForgeAI-Setup-x64-v1.1.2.exe | findstr /C:"machine (x64)"

      - name: Upload native x64 app
        uses: actions/upload-artifact@v4
        with:
          name: ImageForgeAI-Win64-v1.1.2-final
          path: dist/ImageForgeAI.exe
          if-no-files-found: error

      - name: Upload native x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: ImageForgeAI-Setup-x64-v1.1.2-final
          path: dist-installer/ImageForgeAI-Setup-x64-v1.1.2.exe
          if-no-files-found: error
